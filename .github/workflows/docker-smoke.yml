name: Docker Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start API and PostgreSQL
        env:
          POSTGRES_PASSWORD: smoke-postgres-password
          AUTH_SECRET: smoke-test-auth-secret-change-this-value
          SEED_ADMIN_PASSWORD: smoke-test-password-12345
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test database-backed API
        env:
          SEED_ADMIN_PASSWORD: smoke-test-password-12345
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4000/health
          curl -fsS -D /tmp/specialcare-login.headers -o /tmp/specialcare-login.json \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo.clinician@specialcare.local","password":"smoke-test-password-12345"}' \
            http://127.0.0.1:4000/api/v1/auth/login
          SESSION_COOKIE="$(grep -i '^set-cookie:' /tmp/specialcare-login.headers | sed -E 's/^[^:]+: sc_session=([^;]+).*/\1/I' | tr -d '\r')"
          test -n "$SESSION_COOKIE"
          for endpoint in \
            /api/v1/hospitals \
            /api/v1/hierarchy \
            /api/v1/dashboard/summary \
            /api/v1/patients \
            /api/v1/admissions \
            /api/v1/appointments \
            /api/v1/doctors \
            /api/v1/diagnostics/orders \
            /api/v1/prescriptions \
            /api/v1/inventory/items \
            /api/v1/operations/summary \
            /api/v1/emergency \
            /api/v1/icu \
            /api/v1/ot \
            /api/v1/blood-bank \
            /api/v1/ambulances; do
            echo "Checking $endpoint"
            curl -fsS -H "Cookie: sc_session=$SESSION_COOKIE" "http://127.0.0.1:4000$endpoint" >/dev/null
          done

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
