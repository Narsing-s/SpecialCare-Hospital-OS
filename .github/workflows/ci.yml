name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate Prisma client
        run: npm run generate --workspace @specialcare/database
      - name: Validate database schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma
      - name: Build API
        run: npm run build --workspace @specialcare/api
      - name: Build existing web UI
        run: npm run build --workspace @specialcare/web
      - name: Smoke test web app and demo API
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace @specialcare/web > /tmp/specialcare-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/login >/dev/null
          curl -fsS http://127.0.0.1:3000/manifest.json | grep -q 'SpecialCare Hospital OS'
          curl -fsS http://127.0.0.1:3000/api/v1/auth/me | grep -q 'authenticated'
          curl -fsS http://127.0.0.1:3000/api/v1/dashboard/summary | grep -q 'beds'
