name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specialcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d specialcare"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specialcare
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run generate --workspace @specialcare/database
      - run: npx prisma validate --schema packages/database/prisma/schema.prisma
      - run: npm run migrate:deploy --workspace @specialcare/database
      - run: npm run build --workspace @specialcare/api
      - run: npm run build --workspace @specialcare/web
